---
# GCE Cloud Build implementation for kernel builds
#
# This task file submits a kernel build to GCE Cloud Build, waits for
# completion, and downloads the artifacts to the local artifacts directory.
# Installation on target nodes is handled separately via WORKFLOW_LINUX_PACKAGED.

- name: Set GCE Cloud Build variables from extra_vars
  ansible.builtin.set_fact:
    cloud_build_bucket: "{{ terraform_gce_cloud_build_bucket | default('') }}"
    cloud_build_region: "{{ terraform_gce_region | default('us-west1') }}"
    cloud_build_project: "{{ terraform_gce_project | default('') }}"
    cloud_build_artifact_prefix: "kernels/{{ target_linux_ref }}"
  run_once: true
  delegate_to: localhost

# Query terraform output if bucket not in extra_vars (happens in cloud build mode
# since extra_vars is generated before terraform provisions infrastructure)
- name: Query Cloud Build bucket from terraform output
  ansible.builtin.command:
    cmd: terraform output -raw cloud_build_bucket
    chdir: "{{ topdir_path }}/terraform/gce"
  register: terraform_bucket_output
  run_once: true
  delegate_to: localhost
  changed_when: false
  failed_when: false
  when: cloud_build_bucket == ''

- name: Set Cloud Build bucket from terraform output
  ansible.builtin.set_fact:
    cloud_build_bucket: "{{ terraform_bucket_output.stdout }}"
  run_once: true
  delegate_to: localhost
  when:
    - cloud_build_bucket == ''
    - terraform_bucket_output.rc == 0
    - terraform_bucket_output.stdout | trim != ''

- name: Validate Cloud Build bucket is configured
  ansible.builtin.assert:
    that:
      - cloud_build_bucket != ''
    fail_msg: >-
      Cloud Build bucket is not configured. Ensure Terraform provisioned
      the Cloud Build infrastructure. Run 'terraform output cloud_build_bucket'
      in terraform/gce/ to verify the bucket exists.
  run_once: true
  delegate_to: localhost

- name: Validate GCE project is configured
  ansible.builtin.assert:
    that:
      - cloud_build_project != ''
    fail_msg: >-
      GCE project is not configured. Ensure terraform_gce_project is set
      in extra_vars.yaml via the GCE Kconfig options.
  run_once: true
  delegate_to: localhost

- name: Set kernel config path
  ansible.builtin.set_fact:
    cloud_build_config_path: "{{ role_path }}/templates/{{ linux_config | default('config-kdevops') }}"
    cloud_build_config_gcs_path: "{{ cloud_build_artifact_prefix }}/config"
  run_once: true
  delegate_to: localhost

- name: Upload kernel config to GCS
  ansible.builtin.command:
    cmd: >-
      python3 {{ topdir_path }}/terraform/gce/scripts/cloud_build.py
      upload
      --bucket {{ cloud_build_bucket }}
      --source {{ cloud_build_config_path }}
      --dest {{ cloud_build_config_gcs_path }}
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ terraform_gce_credentials | expanduser }}"
  run_once: true
  delegate_to: localhost
  changed_when: true

- name: Generate Cloud Build configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/cloudbuild/gce_cloudbuild.yaml.j2"
    dest: "{{ topdir_path }}/terraform/gce/cloudbuild.yaml"
    mode: "0644"
  run_once: true
  delegate_to: localhost

# Submit and wait for Cloud Build, with automatic retry if the operation
# is not found (e.g., expired from a previous interrupted run).
- name: Submit and wait for Cloud Build
  block:
    - name: Submit Cloud Build job
      ansible.builtin.command:
        cmd: >-
          python3 {{ topdir_path }}/terraform/gce/scripts/cloud_build.py
          submit
          --project {{ cloud_build_project }}
          --region {{ cloud_build_region }}
          --config {{ topdir_path }}/terraform/gce/cloudbuild.yaml
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ terraform_gce_credentials | expanduser }}"
      register: cloud_build_submit
      run_once: true
      delegate_to: localhost
      changed_when: true

    - name: Validate Cloud Build submission output
      ansible.builtin.fail:
        msg: >-
          Cloud Build submission returned no output. Command stderr:
          {{ cloud_build_submit.stderr | default('(none)') }}
      when: cloud_build_submit.stdout is not defined or cloud_build_submit.stdout | trim == ''
      run_once: true
      delegate_to: localhost

    - name: Parse Cloud Build submission result
      block:
        - name: Attempt to parse submission JSON
          ansible.builtin.set_fact:
            cloud_build_submit_parsed: "{{ cloud_build_submit.stdout | from_json }}"
          run_once: true
          delegate_to: localhost

        - name: Validate operation key exists
          ansible.builtin.fail:
            msg: >-
              Cloud Build submission response missing 'operation' key.
              Response: {{ cloud_build_submit_parsed | to_nice_json }}
          when: cloud_build_submit_parsed.operation is not defined
          run_once: true
          delegate_to: localhost

        - name: Set cloud_build_operation
          ansible.builtin.set_fact:
            cloud_build_operation: "{{ cloud_build_submit_parsed.operation }}"
          run_once: true
          delegate_to: localhost
      rescue:
        - name: Report JSON parsing failure
          ansible.builtin.fail:
            msg: >-
              Failed to parse Cloud Build submission output as JSON.
              Raw output: {{ cloud_build_submit.stdout }}
          run_once: true
          delegate_to: localhost

    - name: Display Cloud Build operation
      ansible.builtin.debug:
        msg: "Cloud Build submitted: {{ cloud_build_operation }}"
      run_once: true
      delegate_to: localhost

    - name: Wait for Cloud Build to complete
      ansible.builtin.command:
        cmd: >-
          python3 {{ topdir_path }}/terraform/gce/scripts/cloud_build.py
          wait
          --operation {{ cloud_build_operation }}
          --timeout {{ bootlinux_cloud_build_timeout_minutes | default(60) }}
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ terraform_gce_credentials | expanduser }}"
      register: cloud_build_result
      run_once: true
      delegate_to: localhost
      changed_when: false
  rescue:
    # If the wait failed with exit code 2, the operation was not found.
    # This can happen if a previous build was interrupted and the operation
    # expired. Re-submit a fresh build.
    - name: Check if operation was not found
      ansible.builtin.fail:
        msg: "Cloud Build failed: {{ cloud_build_result.stderr | default('unknown error') }}"
      when: cloud_build_result.rc | default(1) != 2
      run_once: true
      delegate_to: localhost

    - name: Log operation not found, resubmitting
      ansible.builtin.debug:
        msg: >-
          Previous Cloud Build operation not found (may have expired).
          Submitting a fresh build.
      run_once: true
      delegate_to: localhost

    - name: Resubmit Cloud Build job
      ansible.builtin.command:
        cmd: >-
          python3 {{ topdir_path }}/terraform/gce/scripts/cloud_build.py
          submit
          --project {{ cloud_build_project }}
          --region {{ cloud_build_region }}
          --config {{ topdir_path }}/terraform/gce/cloudbuild.yaml
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ terraform_gce_credentials | expanduser }}"
      register: cloud_build_submit
      run_once: true
      delegate_to: localhost
      changed_when: true

    - name: Parse resubmission result
      ansible.builtin.set_fact:
        cloud_build_submit_parsed: "{{ cloud_build_submit.stdout | from_json }}"
        cloud_build_operation: "{{ (cloud_build_submit.stdout | from_json).operation }}"
      run_once: true
      delegate_to: localhost

    - name: Display resubmitted Cloud Build operation
      ansible.builtin.debug:
        msg: "Cloud Build resubmitted: {{ cloud_build_operation }}"
      run_once: true
      delegate_to: localhost

    - name: Wait for resubmitted Cloud Build to complete
      ansible.builtin.command:
        cmd: >-
          python3 {{ topdir_path }}/terraform/gce/scripts/cloud_build.py
          wait
          --operation {{ cloud_build_operation }}
          --timeout {{ bootlinux_cloud_build_timeout_minutes | default(60) }}
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ terraform_gce_credentials | expanduser }}"
      register: cloud_build_result
      run_once: true
      delegate_to: localhost
      changed_when: false

- name: Parse Cloud Build result
  ansible.builtin.set_fact:
    cloud_build_status: "{{ (cloud_build_result.stdout | from_json).status | default('UNKNOWN') }}"
  run_once: true
  delegate_to: localhost

- name: Verify Cloud Build succeeded
  ansible.builtin.assert:
    that:
      - cloud_build_status == 'SUCCESS'
    fail_msg: "Cloud Build completed with status: {{ cloud_build_status }}"
    success_msg: "Cloud Build completed successfully"
  run_once: true
  delegate_to: localhost

- name: Remove old artifacts directory on the control host
  ansible.builtin.file:
    path: "{{ bootlinux_artifacts_dir }}"
    state: absent
  run_once: true
  delegate_to: localhost

- name: Ensure an empty artifacts directory exists on the control host
  ansible.builtin.file:
    path: "{{ bootlinux_artifacts_dir }}"
    state: directory
    mode: "0755"
  run_once: true
  delegate_to: localhost

- name: Download kernel artifacts from GCS
  ansible.builtin.command:
    cmd: >-
      python3 {{ topdir_path }}/terraform/gce/scripts/cloud_build.py
      download
      --bucket {{ cloud_build_bucket }}
      --prefix {{ cloud_build_artifact_prefix }}
      --dest {{ bootlinux_artifacts_dir }}
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ terraform_gce_credentials | expanduser }}"
  register: cloud_build_download
  run_once: true
  delegate_to: localhost
  changed_when: true

- name: Parse downloaded files list with safe fallback
  block:
    - name: Parse download output JSON
      ansible.builtin.set_fact:
        cloud_build_download_parsed: "{{ cloud_build_download.stdout | default('{}') | from_json }}"
        cloud_build_download_parse_failed: false
      run_once: true
      delegate_to: localhost
  rescue:
    - name: Handle JSON parsing failure
      ansible.builtin.set_fact:
        cloud_build_download_parsed: {}
        cloud_build_download_parse_failed: true
      run_once: true
      delegate_to: localhost

- name: Set downloaded files list with fallback
  ansible.builtin.set_fact:
    cloud_build_downloaded_files: "{{ cloud_build_download_parsed.files | default([]) }}"
  run_once: true
  delegate_to: localhost

- name: Warn about empty or unparseable download output
  ansible.builtin.debug:
    msg: >-
      Cloud Build download output could not be parsed or is missing 'files' key.
      Raw output: {{ cloud_build_download.stdout | default('(no output)') }}
  when: cloud_build_download_parse_failed | default(false) or cloud_build_downloaded_files | length == 0
  run_once: true
  delegate_to: localhost

- name: Display downloaded artifacts
  ansible.builtin.debug:
    msg: "Downloaded {{ cloud_build_downloaded_files | length }} artifact(s) to {{ bootlinux_artifacts_dir }}"
  run_once: true
  delegate_to: localhost

- name: Skip the kernel install steps
  ansible.builtin.meta: end_play
