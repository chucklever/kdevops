---
# AWS CodeBuild placeholder - not yet implemented
#
# This file provides a clear error message when attempting to use
# cloud builds with AWS. Future implementation would use CodeBuild
# to build kernels and S3 for artifact storage.

- name: AWS CodeBuild not yet implemented
  ansible.builtin.fail:
    msg: >-
      AWS CodeBuild support is not yet implemented for kernel builds.
      Use BOOTLINUX_TARGETS or BOOTLINUX_BUILDER instead, or switch
      to GCE which supports cloud builds.
